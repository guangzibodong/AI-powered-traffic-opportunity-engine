<svg width="1280" height="720" viewBox="0 0 1280 720" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">TrafScope architecture</title>
  <desc id="desc">Monorepo architecture showing frontend, API, services, workers, database, integrations, and safety controls.</desc>
  <rect width="1280" height="720" fill="#0f1216"/>
  <rect x="56" y="48" width="1168" height="624" rx="20" fill="#14181e" stroke="#2a313b"/>
  <text x="88" y="96" fill="#f4f7f8" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="26" font-weight="750">TrafScope Commerce OS Architecture</text>
  <text x="88" y="126" fill="#9aa8b5" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="14">A safe, evidence-first loop from store and search data to task execution and performance tracking.</text>
